name = "thefluencytalks"
compatibility_date = "2026-10-20"
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Only the blog and the FAQ (on / and /faq) run code; every other path is a plain file.
run_worker_first = ["/", "/faq", "/blog", "/blog/*", "/sitemap.xml", "/llms.txt"]

[build]
command = "npm run build"
