    <noscript>
      <header>
        <h1>The Fluency Talks: free language exchange with native speakers</h1>
      </header>
      <main>
        <p>The Fluency Talks is a free language exchange app. Tell us the language you speak and the one you are learning, we show you native speakers of your target language and learners of yours (no perfect swap needed), and they correct your messages right inside the chat.</p>
        <h2>Who it is for</h2>
        <p>Language learners at any level from A1 to C2, and native or fluent speakers who want to help someone a few steps behind them. 40 languages, including English, Vietnamese, Swahili, Spanish, French, German, Portuguese, Chinese, Japanese, Korean, Hindi and Arabic.</p>
        <h2>What you can do</h2>
        <ul>
          <li>Find a language partner matched by language, not popularity.</li>
          <li>Chat one to one and get your sentences corrected inside the conversation.</li>
          <li>Save accepted corrections to your own phrasebook, and translate any message you don't understand.</li>
          <li>Read phrases, idioms and grammar tips that native speakers post to the community library.</li>
          <li>Earn 5 points for each correction you give that is accepted, and spend 50 on a bounty when you are stuck.</li>
        </ul>
        <h2>How it works</h2>
        <ol>
          <li>Pick your native language and the language and level you are learning.</li>
          <li>Message a matched partner; they can accept or decline.</li>
          <li>Talk, get corrected, and keep the phrase.</li>
        </ol>
        <h2>Why The Fluency Talks</h2>
        <p>Corrections happen inside the chat, there are no followers or likes, new contacts arrive as requests you can decline, and it is completely free with no paid plans.</p>
        <p><a href="/signup">Create your free account</a> · <a href="/#faq">FAQ</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
