name: check
# Every push and pull request: the app must type-check and build, and the database migrations must
# build from scratch and match what the app calls (functions, parameter names) and replay the
# app's flows. This is what stops a hand-merged or rewritten migration from breaking onboarding.
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:auth
      # The build prerenders the public pages; it needs these two values to exist, not to be real.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      # What a crawler that does not run JavaScript sees: titles, descriptions, canonicals, one H1, sitemap, robots.
      - run: npm run check:seo
      # A changed privacy policy or terms needs a new version, so consent stays provable down to the wording.
      - run: npm run check:legal

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-db.sh
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
